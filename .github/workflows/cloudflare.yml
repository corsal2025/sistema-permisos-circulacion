name: Cloudflare

on:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'dashboard/index.html', 'dashboard/vendor/**', '.github/workflows/cloudflare.yml']
  pull_request:
    paths: ['cloudflare/**', 'dashboard/index.html', 'dashboard/vendor/**', '.github/workflows/cloudflare.yml']
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: cloudflare

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm test

  desplegar:
    needs: pruebas
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: produccion
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - name: Crear la base D1 si no existe y fijar su id
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="correspondencia");process.stdout.write(d?d.uuid:"")')
          if [ -z "$ID" ]; then
            npx wrangler d1 create correspondencia
            ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));process.stdout.write(l.find(x=>x.name==="correspondencia").uuid)')
          fi
          sed -i "s/REEMPLAZAR_CON_ID_DE_D1/$ID/" wrangler.toml
      - name: Crear el bucket R2 de adjuntos si no existe
        run: npx wrangler r2 bucket list | grep -q "correspondencia-adjuntos" || npx wrangler r2 bucket create correspondencia-adjuntos
      - run: npm run deploy
