name: Servidor .NET

on:
  push:
    paths: ['servidor/**', 'dashboard/**', 'cloudflare/test/**', '.github/workflows/servidor.yml']
  pull_request:
    paths: ['servidor/**', 'dashboard/**', 'cloudflare/test/**', '.github/workflows/servidor.yml']

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build servidor/Servidor.csproj -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Pruebas de API contra el servidor .exe
        working-directory: cloudflare
        run: |
          npm ci
          npm run test:dotnet
