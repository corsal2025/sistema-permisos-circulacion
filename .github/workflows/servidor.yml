name: Servidor .NET

on:
  push:
    paths: ['servidor/**', 'dashboard/**', 'pruebas/**', '.github/workflows/servidor.yml']
  pull_request:
    paths: ['servidor/**', 'dashboard/**', 'pruebas/**', '.github/workflows/servidor.yml']

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build servidor/Servidor.csproj -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas de API contra el servidor .exe y del lector de oficios
        working-directory: pruebas
        run: npm test
